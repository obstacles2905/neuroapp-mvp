# Railway service config (monorepo root = repository root).
# In Railway: New Project → Deploy from GitHub → set Root Directory to repo root (not backend/).
# Add a Postgres plugin and reference DATABASE_URL in the API service variables.

[build]
builder = "DOCKERFILE"
dockerfilePath = "backend/Dockerfile"

[deploy]
# Must match backend/Dockerfile CMD. Do not use `npm run start -w backend` (runs `nest start`, needs devDependencies).
startCommand = "node backend/dist/main.js"
healthcheckPath = "/api/admin/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
